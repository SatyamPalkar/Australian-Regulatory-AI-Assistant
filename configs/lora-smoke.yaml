# Ten-step hardware benchmark on a short subset; not the final adapter.
model: models/generator
train: true
fine_tune_type: lora
data: data/training-smoke
mask_prompt: true
seed: 42
num_layers: 4
batch_size: 1
iters: 10
val_batches: 2
max_seq_length: 768
learning_rate: 1.0e-5
grad_checkpoint: true
steps_per_report: 1
steps_per_eval: 10
save_every: 10
adapter_path: adapters/smoke
lora_parameters:
  rank: 4
  scale: 8.0
  dropout: 0.0
