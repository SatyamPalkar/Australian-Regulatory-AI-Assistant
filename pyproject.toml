[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "australian-regulatory-assistant"
version = "0.3.0"
description = "Local retrieval and cited answers over Australian regulatory guidance"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
mlx = ["mlx-lm>=0.26,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
benchmark = ["psutil>=6,<8"]

[project.scripts]
reg-assistant = "reg_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["reg_assistant*"]
